<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC Synthetic Data Generator</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <div id="ui-container">
        <h4>FRC Synthetic Data Generator</h4>

        <button id="regen-btn">Generate New Frame</button>

        <hr>

        <label>
            <input type="checkbox" id="toggle-grayscale" checked> Black & White
        </label>

        <label for="noise-amount">Noise Amount:</label>
        <input type="range" id="noise-amount" min="0" max="0.5" step="0.01" value="0.15">
        <span class="value-display" id="noise-amount-value">0.15</span>

        <label for="env-brightness">Environment Brightness:</label>
        <input type="range" id="env-brightness" min="0" max="10" step="0.1" value="3.0">
        <span class="value-display" id="env-brightness-value">3.0</span>

        <label for="env-falloff">Environment Falloff:</label>
        <input type="range" id="env-falloff" min="0.5" max="5.0" step="0.1" value="2.0">
        <span class="value-display" id="env-falloff-value">2.0</span>

        <label for="camera-height">Camera Height (m):</label>
        <input type="range" id="camera-height" min="0.2" max="2.0" step="0.01" value="0.3">
        <span class="value-display" id="camera-height-value">0.30 m</span>

        <label for="piece-height">Piece Height Trim:</label>
        <input type="range" id="piece-height" min="-0.1" max="0.2" step="0.005" value="0.075">
        <span class="value-display" id="piece-height-value">0.075</span>

        <label>Resolution:</label>
        <div class="button-group">
            <button id="res-1920x1200">1920×1200</button>
            <button id="res-1280x720">1280×720</button>
            <button id="res-640x480">640×480</button>
        </div>

        <hr>

        <label for="batch-count">Images to Generate:</label>
        <input type="number" id="batch-count" min="1" max="10000" value="100">

        <button id="download-batch-btn">Download YOLO Dataset (ZIP)</button>
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="batch-progress"></div>

        <hr>

        <label>Camera Transform</label>
        <div id="camera-info">
            <div class="camera-transform-section">
                <div class="transform-label">Position</div>
                <div class="transform-row">
                    <div class="transform-input">
                        <label>X</label>
                        <input type="number" id="camera-x" step="0.1" value="0">
                    </div>
                    <div class="transform-input">
                        <label>Y</label>
                        <input type="number" id="camera-y" step="0.1" value="0">
                    </div>
                    <div class="transform-input">
                        <label>Z</label>
                        <input type="number" id="camera-z" step="0.1" value="0">
                    </div>
                </div>
            </div>
            <div class="camera-transform-section">
                <div class="transform-label">Rotation</div>
                <div class="transform-row">
                    <div class="transform-input">
                        <label>Pitch</label>
                        <input type="number" id="camera-pitch-info" step="1" value="0">
                    </div>
                    <div class="transform-input">
                        <label>Yaw</label>
                        <input type="number" id="camera-yaw-info" step="1" value="0">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <div id="canvas-wrapper"></div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
